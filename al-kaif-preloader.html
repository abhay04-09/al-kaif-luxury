<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Al-Kaif — Preloader</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0c0a09;
    --ink-2:#1a1512;
    --ember:#f01905;
    --ember-deep:#7a0f04;
    --gold:#c9a24b;
    --gold-light:#e9cf94;
    --ivory:#f3ece0;
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--ivory);
    font-family:'Cormorant Garamond', Georgia, serif;
    color:var(--ink);
  }

  /* ============ PRELOADER ============ */
  #ak-preloader{
    position:fixed;
    inset:0;
    z-index:9999;
    background:
      radial-gradient(120% 90% at 50% 38%, var(--ink-2) 0%, var(--ink) 62%, #060504 100%);
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
    transition:opacity .85s cubic-bezier(.4,0,.2,1), transform .85s cubic-bezier(.4,0,.2,1);
  }

  /* fine grain, for a lined-jewellery-box feel rather than a flat gradient */
  #ak-preloader::before{
    content:"";
    position:absolute;
    inset:0;
    opacity:.05;
    mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    pointer-events:none;
  }

  /* inset hairline frame, like the edge of a fitted case */
  .ak-frame{
    position:absolute;
    inset:22px;
    border:1px solid rgba(201,162,75,.22);
    opacity:0;
    animation:ak-frame-in 1s ease-out forwards;
    animation-delay:.1s;
    pointer-events:none;
  }
  @keyframes ak-frame-in{ to{ opacity:1; } }

  #ak-preloader.ak-done{
    opacity:0;
    transform:scale(1.035);
    pointer-events:none;
  }
  #ak-preloader.ak-done .ak-frame{
    inset:8px;
    opacity:0;
    transition:inset .85s cubic-bezier(.4,0,.2,1), opacity .6s ease;
  }

  .ak-stage{
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:22px;
    padding:0 24px;
  }

  /* ember bloom behind the mark, breathes once */
  .ak-glow{
    position:absolute;
    top:34%;
    left:50%;
    width:min(70vw, 380px);
    height:min(70vw, 380px);
    transform:translate(-50%,-50%) scale(.6);
    background:radial-gradient(circle, rgba(240,25,5,.32) 0%, rgba(122,15,4,.12) 45%, rgba(240,25,5,0) 70%);
    filter:blur(4px);
    opacity:0;
    animation:ak-ember 2s cubic-bezier(.3,.6,.3,1) forwards;
  }
  @keyframes ak-ember{
    0%   { opacity:0;   transform:translate(-50%,-50%) scale(.5); }
    50%  { opacity:1;   transform:translate(-50%,-50%) scale(1);  }
    100% { opacity:.32; transform:translate(-50%,-50%) scale(1.12);}
  }

  /* logo mark — curtain-style wipe reveal, like opening a case */
  .ak-mark{
    position:relative;
    width:clamp(170px, 28vw, 270px);
    clip-path:inset(0 100% 0 0);
    animation:ak-wipe 1.05s cubic-bezier(.65,0,.2,1) forwards;
    animation-delay:.35s;
  }
  .ak-mark img{
    display:block;
    width:100%;
    height:auto;
    filter:drop-shadow(0 14px 30px rgba(240,25,5,.22));
  }
  @keyframes ak-wipe{ to{ clip-path:inset(0 0 0 0); } }

  /* a single pass of light once the mark is fully revealed */
  .ak-mark::after{
    content:"";
    position:absolute;
    inset:-8% -25%;
    background:linear-gradient(115deg, transparent 42%, rgba(255,255,255,.5) 50%, transparent 58%);
    mix-blend-mode:screen;
    transform:translateX(-130%);
    animation:ak-gleam 1.1s ease-in forwards;
    animation-delay:1.45s;
  }
  @keyframes ak-gleam{ to{ transform:translateX(130%); } }

  /* gem accent + hairline divider, echoing a set stone */
  .ak-divider{
    display:flex;
    align-items:center;
    gap:10px;
    opacity:0;
    animation:ak-fadein .6s ease forwards;
    animation-delay:1.5s;
  }
  .ak-divider .rule{ width:34px; height:1px; background:linear-gradient(90deg, transparent, rgba(201,162,75,.55)); }
  .ak-divider .rule.right{ background:linear-gradient(90deg, rgba(201,162,75,.55), transparent); }
  .ak-gem{
    width:7px; height:7px;
    background:linear-gradient(135deg, var(--gold-light), var(--gold));
    transform:rotate(45deg);
    box-shadow:0 0 8px rgba(201,162,75,.5);
  }

  @keyframes ak-fadein{ to{ opacity:1; } }

  /* progress ring */
  .ak-ring-wrap{
    position:relative;
    width:58px; height:58px;
    opacity:0;
    animation:ak-fadein .6s ease forwards;
    animation-delay:1.75s;
  }
  .ak-ring-wrap svg{ transform:rotate(-90deg); }
  .ak-ring-track{ fill:none; stroke:rgba(245,239,230,.14); stroke-width:1.4; }
  .ak-ring-fill{
    fill:none; stroke:url(#ak-ring-gradient); stroke-width:1.4; stroke-linecap:round;
    stroke-dasharray:163.36; stroke-dashoffset:163.36;
    transition:stroke-dashoffset .18s linear;
  }
  .ak-ring-percent{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    font-size:12px; letter-spacing:.02em; color:var(--ivory); font-variant-numeric:tabular-nums;
  }

  .ak-caption{
    font-style:italic;
    font-size:13px;
    letter-spacing:.03em;
    color:rgba(243,236,224,.5);
    opacity:0;
    animation:ak-fadein .6s ease forwards;
    animation-delay:1.9s;
  }

  @media (max-width:420px){
    .ak-frame{ inset:14px; }
  }

  @media (prefers-reduced-motion: reduce){
    .ak-mark{ clip-path:inset(0 0 0 0); animation:none; opacity:1; }
    .ak-mark::after{ display:none; }
    .ak-glow, .ak-frame, .ak-divider, .ak-ring-wrap, .ak-caption{ animation:none !important; opacity:1 !important; }
    #ak-preloader{ transition:opacity .35s ease; }
  }

  /* ============ mock page behind, for preview only ============ */
  .demo-page{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:40px; text-align:center; background:var(--ivory); }
  .demo-page h1{ font-family:'Cormorant Garamond', serif; font-weight:500; font-size:34px; letter-spacing:.01em; margin-bottom:6px; color:var(--ink); }
  .demo-page p{ color:#6b6459; font-size:15px; }
  .replay{
    margin-top:24px; padding:10px 24px; font-size:13px; letter-spacing:.05em;
    background:var(--ink); color:var(--ivory); border:none; cursor:pointer;
    font-family:'Cormorant Garamond', serif;
  }
  .replay:hover{ background:var(--ember-deep); }
</style>
</head>
